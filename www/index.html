<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0f13">
<title>Ember</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="css/app.css">
<script>try{var s=JSON.parse(localStorage.getItem('ember.v1')||'{}').settings||{};var t=s.theme||'system';document.documentElement.dataset.theme=(t==='dark'||(t==='system'&&!matchMedia('(prefers-color-scheme: light)').matches))?'dark':'light';}catch(e){}</script>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="Main"><div class="in">
  <button data-tab="today" aria-label="Home"></button>
  <button data-tab="day" aria-label="My day"></button>
  <button class="add" data-a="quick" aria-label="Add"></button>
  <button data-tab="insights" aria-label="Insights"></button>
  <button data-tab="hub" aria-label="Everything"></button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/foods.js"></script>
<script src="js/data-body.js"></script>

<script src="js/today.js"></script>
<script src="js/home.js"></script>
<script src="js/extras.js"></script>
<script src="js/plan.js"></script>
<script src="js/health.js"></script>
<script src="js/money.js"></script>
<script src="js/grow.js"></script>
<script src="js/focus.js"></script>
<script src="js/insights.js"></script>
<script src="js/settings.js"></script>
<script src="js/native.js"></script>
<script src="js/main.js"></script>
</body>
</html>
